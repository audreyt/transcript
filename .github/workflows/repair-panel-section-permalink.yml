name: Repair panel section permalink

on:
  workflow_dispatch:

concurrency:
  group: repair-panel-section-permalink
  cancel-in-progress: false

jobs:
  restore-section-id:
    runs-on: ubuntu-latest
    env:
      API_ENDPOINT: https://archive.tw/api/upload_markdown
      AUDREYT_TRANSCRIPT_TOKEN: ${{ secrets.AUDREYT_TRANSCRIPT_TOKEN }}
      BESTIAN_TRANSCRIPT_TOKEN: ${{ secrets.BESTIAN_TRANSCRIPT_TOKEN }}
    steps:
      - name: Checkout transcript
        uses: actions/checkout@v6

      - name: Resolve token
        id: token
        shell: bash
        run: |
          audreyt="${AUDREYT_TRANSCRIPT_TOKEN:-}"
          bestian="${BESTIAN_TRANSCRIPT_TOKEN:-}"
          if [ -n "${audreyt}" ]; then
            echo "Using AUDREYT_TRANSCRIPT_TOKEN" >&2
            echo "value=${audreyt}" >> "${GITHUB_OUTPUT}"
          elif [ -n "${bestian}" ]; then
            echo "::warning::AUDREYT_TRANSCRIPT_TOKEN is empty or unset; falling back to BESTIAN_TRANSCRIPT_TOKEN" >&2
            echo "value=${bestian}" >> "${GITHUB_OUTPUT}"
          else
            echo "Neither AUDREYT_TRANSCRIPT_TOKEN nor BESTIAN_TRANSCRIPT_TOKEN is set (or both are empty)." >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore panel section permalinks
        env:
          TOKEN: ${{ steps.token.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 180 --silent --show-error --request POST https://archive.tw/api/repair_panel_section_ids --header "Authorization: Bearer ${TOKEN}")"
          printf '%s\n' "${response}"
          printf '%s' "${response}" | jq -e '.success == true and (.repaired | type == "boolean")' >/dev/null

      - name: Refresh the two repaired panel documents
        env:
          TOKEN: ${{ steps.token.outputs.value }}
          API_REDIRECTS_ENDPOINT: ""
        shell: bash
        run: |
          bun -e '
            import { runSync } from "./scripts/sync_markdown.ts";

            const changedFiles = [
              "2026-07-24-State-of-Wikimedia-and-AI-Panel.md",
              "2026-07-24-「維基媒體與-AI-現況」座談.md",
            ];
            const diff = changedFiles.map((filename) => `M\0${filename}\0`).join("");
            const status = await runSync(process.env, [], { git: () => diff });
            process.exit(status);
          '
